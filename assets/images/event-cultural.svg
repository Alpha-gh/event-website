<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cult" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="50%" stop-color="#491064"/>
      <stop offset="100%" stop-color="#190432"/>
    </linearGradient>
    <linearGradient id="cult-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a0845" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg-cult)"/>
  <rect width="800" height="450" fill="url(#spotlight)"/>
  
  <!-- Stage Spotlights -->
  <polygon points="120,0 20,450 260,450" fill="#f43f5e" opacity="0.08"/>
  <polygon points="680,0 540,450 780,450" fill="#8b5cf6" opacity="0.1"/>
  
  <!-- Musical Waves / Sound Graphics -->
  <g transform="translate(480, 120)" opacity="0.85">
    <!-- Guitar & Notes Abstract Art -->
    <path d="M 120 40 C 90 90, 80 140, 110 200 C 140 260, 210 230, 200 170 C 190 120, 160 80, 120 40 Z" fill="#8b5cf6" opacity="0.4"/>
    <circle cx="150" cy="160" r="30" fill="#190432" stroke="#ec4899" stroke-width="3"/>
    
    <!-- Audio Bars -->
    <rect x="30" y="160" width="8" height="60" rx="4" fill="#f43f5e"/>
    <rect x="45" y="130" width="8" height="90" rx="4" fill="#fb7185"/>
    <rect x="60" y="100" width="8" height="120" rx="4" fill="#f472b6"/>
    <rect x="75" y="140" width="8" height="80" rx="4" fill="#c084fc"/>
    <rect x="230" y="120" width="8" height="100" rx="4" fill="#ec4899"/>
    <rect x="245" y="150" width="8" height="70" rx="4" fill="#a855f7"/>
    <rect x="260" y="110" width="8" height="110" rx="4" fill="#f43f5e"/>
    
    <!-- Floating Sparkles -->
    <circle cx="90" cy="70" r="4" fill="#fde047"/>
    <circle cx="210" cy="60" r="6" fill="#f472b6"/>
    <circle cx="270" cy="230" r="5" fill="#38bdf8"/>
  </g>
  
  <!-- Content -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4" fill="#ec4899"/>
    <text x="32" y="21" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ANNUAL CULTURAL GALA</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">EUPHORIA 2026</text>
    <text x="0" y="115" fill="#fbcfe8" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">Music, Dance, Drama, Fashion &amp; Celebrity Night</text>
    
    <!-- Badges -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="135" height="50" rx="8" fill="#491064" stroke="#ec4899" stroke-width="1"/>
      <text x="16" y="22" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="600">CELEBRITY NIGHT</text>
      <text x="16" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Bollywood Live</text>
      
      <rect x="150" y="0" width="135" height="50" rx="8" fill="#491064" stroke="#ec4899" stroke-width="1"/>
      <text x="166" y="22" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="600">COMPETITIONS</text>
      <text x="166" y="40" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="700">Battle of Bands</text>
      
      <rect x="300" y="0" width="135" height="50" rx="8" fill="#491064" stroke="#ec4899" stroke-width="1"/>
      <text x="316" y="22" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="600">ATTENDANCE</text>
      <text x="316" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">10,000+ Footfall</text>
    </g>
  </g>
  
  <text x="740" y="420" text-anchor="end" fill="#ffffff" fill-opacity="0.25" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2">IEM-UEM CULTURAL FEST</text>
</svg>