<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-sem)"/>
  
  <!-- Quantum Orbits -->
  <g transform="translate(600, 220)">
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#6fffe9" stroke-width="1.8" transform="rotate(30)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#5bc0be" stroke-width="1.8" transform="rotate(-30)" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#3a506b" stroke-width="2" transform="rotate(90)" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="#6fffe9"/>
    <circle cx="60" cy="-35" r="6" fill="#ffffff"/>
    <circle cx="-75" cy="40" r="6" fill="#5bc0be"/>
  </g>
  
  <!-- Left Side Text -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#5bc0be" fill-opacity="0.2" stroke="#5bc0be" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4" fill="#6fffe9"/>
    <text x="32" y="21" fill="#6fffe9" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">RESEARCH SEMINAR</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">AI &amp; QUANTUM FRONTIERS</text>
    <text x="0" y="115" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">International Symposium on Generative AI &amp; Quantum Logic</text>
    
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="#1c2541" stroke="#5bc0be" stroke-width="1"/>
      <text x="16" y="22" fill="#6fffe9" font-family="sans-serif" font-size="11" font-weight="600">KEYNOTE SPEAKERS</text>
      <text x="16" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Global Scientists</text>
      
      <rect x="155" y="0" width="140" height="50" rx="8" fill="#1c2541" stroke="#5bc0be" stroke-width="1"/>
      <text x="171" y="22" fill="#6fffe9" font-family="sans-serif" font-size="11" font-weight="600">CERTIFICATE</text>
      <text x="171" y="40" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="700">IEEE Recognized</text>
    </g>
  </g>
  <text x="740" y="420" text-anchor="end" fill="#ffffff" fill-opacity="0.25" font-family="sans-serif" font-size="14" font-weight="700">IEM-UEM ACADEMIC CONCLAVE</text>
</svg>