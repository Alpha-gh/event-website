<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-camp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1931"/>
      <stop offset="60%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="glass-facade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg-camp)"/>
  
  <!-- Campus Modern Architectural Buildings -->
  <g transform="translate(100, 100)">
    <!-- Central Tower -->
    <rect x="220" y="60" width="160" height="280" rx="4" fill="#0c2340" stroke="#38bdf8" stroke-width="2"/>
    <!-- Glass window grid -->
    <g fill="#38bdf8" opacity="0.35">
      <rect x="235" y="80" width="35" height="20" rx="2"/>
      <rect x="282" y="80" width="35" height="20" rx="2"/>
      <rect x="330" y="80" width="35" height="20" rx="2"/>
      
      <rect x="235" y="115" width="35" height="20" rx="2"/>
      <rect x="282" y="115" width="35" height="20" rx="2"/>
      <rect x="330" y="115" width="35" height="20" rx="2"/>
      
      <rect x="235" y="150" width="35" height="20" rx="2"/>
      <rect x="282" y="150" width="35" height="20" rx="2"/>
      <rect x="330" y="150" width="35" height="20" rx="2"/>
      
      <rect x="235" y="185" width="35" height="20" rx="2"/>
      <rect x="282" y="185" width="35" height="20" rx="2"/>
      <rect x="330" y="185" width="35" height="20" rx="2"/>
      
      <rect x="235" y="220" width="35" height="20" rx="2"/>
      <rect x="282" y="220" width="35" height="20" rx="2"/>
      <rect x="330" y="220" width="35" height="20" rx="2"/>
    </g>
    <!-- Tower entrance -->
    <rect x="270" y="280" width="60" height="60" fill="#00f2fe" opacity="0.8"/>
    
    <!-- Left Wing (IEM) -->
    <rect x="60" y="140" width="160" height="200" rx="4" fill="#132f57" stroke="#2563eb" stroke-width="1.5"/>
    <g fill="#60a5fa" opacity="0.4">
      <rect x="80" y="160" width="30" height="18" rx="2"/>
      <rect x="120" y="160" width="30" height="18" rx="2"/>
      <rect x="160" y="160" width="30" height="18" rx="2"/>
      
      <rect x="80" y="195" width="30" height="18" rx="2"/>
      <rect x="120" y="195" width="30" height="18" rx="2"/>
      <rect x="160" y="195" width="30" height="18" rx="2"/>
      
      <rect x="80" y="230" width="30" height="18" rx="2"/>
      <rect x="120" y="230" width="30" height="18" rx="2"/>
      <rect x="160" y="230" width="30" height="18" rx="2"/>
    </g>
    
    <!-- Right Wing (UEM) -->
    <rect x="380" y="120" width="160" height="220" rx="4" fill="#132f57" stroke="#2563eb" stroke-width="1.5"/>
    <g fill="#60a5fa" opacity="0.4">
      <rect x="400" y="145" width="30" height="18" rx="2"/>
      <rect x="445" y="145" width="30" height="18" rx="2"/>
      <rect x="490" y="145" width="30" height="18" rx="2"/>
      
      <rect x="400" y="180" width="30" height="18" rx="2"/>
      <rect x="445" y="180" width="30" height="18" rx="2"/>
      <rect x="490" y="180" width="30" height="18" rx="2"/>
      
      <rect x="400" y="215" width="30" height="18" rx="2"/>
      <rect x="445" y="215" width="30" height="18" rx="2"/>
      <rect x="490" y="215" width="30" height="18" rx="2"/>
    </g>
    
    <!-- Courtyard & Trees -->
    <rect x="0" y="335" width="600" height="25" fill="#059669" opacity="0.8"/>
    <circle cx="100" cy="325" r="22" fill="#10b981"/>
    <circle cx="180" cy="325" r="18" fill="#059669"/>
    <circle cx="420" cy="325" r="20" fill="#10b981"/>
    <circle cx="500" cy="325" r="24" fill="#047857"/>
  </g>
  
  <!-- Banner Overlays -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="680" height="55" rx="8" fill="#0a1931" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
    <text x="30" y="32" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">IEM-UEM Group</text>
    <text x="160" y="32" fill="#94a3b8" font-family="sans-serif" font-size="14">|</text>
    <text x="180" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600">Kolkata &amp; Jaipur Campuses</text>
    <text x="400" y="32" fill="#94a3b8" font-family="sans-serif" font-size="14">|</text>
    <text x="420" y="32" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="600">Estd. 1989 • NAAC 'A' Grade</text>
  </g>
</svg>