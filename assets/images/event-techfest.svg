<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep IEM-UEM Navy to Midnight Blue -->
    <linearGradient id="bg-techfest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061226"/>
      <stop offset="45%" stop-color="#0a1e3f"/>
      <stop offset="80%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Neon Cyan & Electric Blue Accents -->
    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="450" fill="url(#bg-techfest)"/>
  <rect width="800" height="450" fill="url(#grid-pattern)"/>

  <!-- Radial Glow Orbs -->
  <circle cx="630" cy="190" r="210" fill="url(#core-glow)"/>
  <circle cx="160" cy="360" r="150" fill="url(#core-glow)"/>

  <!-- Stage Spotlight Beams -->
  <polygon points="620,0 490,450 780,450" fill="#38bdf8" opacity="0.06"/>
  <polygon points="200,0 80,450 360,450" fill="#2563eb" opacity="0.05"/>

  <!-- Printed Circuit Board Pathways -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45" fill="none" stroke-linejoin="round">
    <path d="M 40,90 L 160,90 L 210,140 L 320,140" />
    <circle cx="320" cy="140" r="4.5" fill="#00f2fe"/>
    
    <path d="M 760,290 L 670,290 L 610,230 L 510,230" />
    <circle cx="510" cy="230" r="4.5" fill="#00f2fe"/>
    
    <path d="M 690,70 L 620,70 L 560,130" />
    <circle cx="560" cy="130" r="4" fill="#38bdf8"/>
    
    <path d="M 460,390 L 530,390 L 570,350 L 650,350" />
    <circle cx="650" cy="350" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Right Side Visual: AI Neural Core, Robotics & Holographic Elements -->
  <g transform="translate(540, 125)">
    <!-- Outer Hexagonal Tech Crest -->
    <polygon points="110,8 198,58 198,158 110,208 22,158 22,58" fill="#0b2545" stroke="#00f2fe" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Central Isometric Quantum Cube -->
    <g transform="translate(10, 8)">
      <path d="M 100,45 L 150,75 L 100,105 L 50,75 Z" fill="#2563eb" opacity="0.95"/>
      <path d="M 50,75 L 100,105 L 100,155 L 50,125 Z" fill="#1d4ed8" opacity="0.98"/>
      <path d="M 150,75 L 100,105 L 100,155 L 150,125 Z" fill="#38bdf8" opacity="0.9"/>
      <circle cx="100" cy="105" r="7" fill="#ffffff"/>
    </g>

    <!-- Laser Orbit Rings -->
    <ellipse cx="110" cy="108" rx="120" ry="42" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="10 6" opacity="0.8"/>
    <ellipse cx="110" cy="108" rx="42" ry="120" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.45" transform="rotate(35 110 108)"/>

    <!-- Neural Network Nodes & Connector Rays -->
    <g stroke="#00f2fe" stroke-width="1.5" opacity="0.75">
      <line x1="110" y1="108" x2="30" y2="40"/>
      <line x1="110" y1="108" x2="190" y2="35"/>
      <line x1="110" y1="108" x2="195" y2="180"/>
      <line x1="110" y1="108" x2="25" y2="175"/>
    </g>
    <circle cx="30" cy="40" r="5" fill="#38bdf8"/>
    <circle cx="190" cy="35" r="5" fill="#00f2fe"/>
    <circle cx="195" cy="180" r="5" fill="#60a5fa"/>
    <circle cx="25" cy="175" r="5" fill="#00f2fe"/>

    <!-- Floating Micro Tech Badges -->
    <g transform="translate(15, 215)">
      <rect x="0" y="0" width="80" height="22" rx="4" fill="#031d2e" stroke="#00f2fe" stroke-width="1" opacity="0.9"/>
      <text x="40" y="15" text-anchor="middle" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">AI CORE</text>

      <rect x="95" y="0" width="95" height="22" rx="4" fill="#031d2e" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="142" y="15" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ROBOTICS</text>
    </g>
  </g>

  <!-- Left Side Typography, Event Branding & Badges -->
  <g transform="translate(55, 105)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="175" height="32" rx="16" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4.5" fill="#00f2fe"/>
    <text x="32" y="21" fill="#00f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">FLAGSHIP TECHFEST</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">INNOVISION 2026</text>
    <text x="0" y="115" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">Annual Techno-Management Conclave</text>

    <!-- Highlights Data Cards -->
    <g transform="translate(0, 160)">
      <!-- Card 1: Robotics & AI -->
      <rect x="0" y="0" width="135" height="52" rx="8" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
      <text x="16" y="22" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ROBOTICS &amp; AI</text>
      <text x="16" y="42" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">35+ Events</text>

      <!-- Card 2: Prize Pool -->
      <rect x="150" y="0" width="135" height="52" rx="8" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
      <text x="166" y="22" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PRIZE POOL</text>
      <text x="166" y="42" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">₹ 5,00,000</text>

      <!-- Card 3: Footfall / Participation -->
      <rect x="300" y="0" width="135" height="52" rx="8" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
      <text x="316" y="22" fill="#60a5fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PARTICIPATION</text>
      <text x="316" y="42" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">50+ Colleges</text>
    </g>
  </g>

  <!-- Watermark: IEM-UEM Official Tech Festival -->
  <text x="745" y="420" text-anchor="end" fill="#ffffff" fill-opacity="0.25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">IEM-UEM TECH FESTIVAL</text>
</svg>
