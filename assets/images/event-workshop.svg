    <path d="M 40,80 Q 20,80 20,60 Q 20,40 45,40 Q 55,10 90,20 Q 120,5 140,35 Q 160,35 160,60 Q 160,80 130,80 Z" fill="#4338ca" opacity="0.6"/>
    <!-- Docker Containers -->
    <rect x="50" y="95" width="28" height="24" rx="3" fill="#6366f1"/>
    <rect x="83" y="95" width="28" height="24" rx="3" fill="#818cf8"/>
    <rect x="116" y="95" width="28" height="24" rx="3" fill="#a5b4fc"/>
    <rect x="66" y="65" width="28" height="24" rx="3" fill="#4f46e5"/>
    <rect x="99" y="65" width="28" height="24" rx="3" fill="#6366f1"/>
  </g>
  
  <g transform="translate(60, 110)">
