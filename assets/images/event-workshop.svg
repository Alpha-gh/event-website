      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-work)"/>
  
  <!-- Cloud & Container graphics -->
  <g transform="translate(560, 140)" fill="none" stroke="#818cf8" stroke-width="2">
