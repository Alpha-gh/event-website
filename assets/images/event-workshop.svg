    <text x="32" y="21" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">HANDS-ON WORKSHOP</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800">WEB3 &amp; CLOUD NATIVE</text>
    <text x="0" y="115" fill="#e0e7ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">Kubernetes, Microservices, Smart Contracts &amp; AWS</text>
    
