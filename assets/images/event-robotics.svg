<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-robo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-robo)"/>
  
  <!-- Robot Arm silhouette & spark -->
  <g transform="translate(560, 120)">
    <path d="M 20,200 L 60,130 L 130,100 L 170,140" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="130" r="10" fill="#e4e4e7"/>
    <circle cx="130" cy="100" r="10" fill="#e4e4e7"/>
    <!-- Laser / Spark -->
    <circle cx="170" cy="140" r="15" fill="#f59e0b" opacity="0.6"/>
    <circle cx="170" cy="140" r="6" fill="#ffffff"/>
  </g>
  
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="190" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4" fill="#fbbf24"/>
    <text x="32" y="21" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AUTONOMOUS ROBOTICS</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800">ROBOWARRIORS 2026</text>
    <text x="0" y="115" fill="#e4e4e7" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">BattleBots, Line Follower, Drone Racing &amp; Maze Solver</text>
    
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="135" height="50" rx="8" fill="#27272a" stroke="#f59e0b" stroke-width="1"/>
      <text x="16" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">ARENA COMBAT</text>
      <text x="16" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">15kg &amp; 30kg Bots</text>
      
      <rect x="150" y="0" width="135" height="50" rx="8" fill="#27272a" stroke="#f59e0b" stroke-width="1"/>
      <text x="166" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">CASH PRIZES</text>
      <text x="166" y="40" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="700">₹ 2,00,000</text>
    </g>
  </g>
  <text x="740" y="420" text-anchor="end" fill="#ffffff" fill-opacity="0.2" font-family="sans-serif" font-size="14" font-weight="700">IEM-UEM ROBOTICS SOCIETY</text>
</svg>