<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sports" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-sports)"/>
  
  <!-- Running Track Curve & Graphic -->
  <g stroke="#34d399" stroke-width="2" fill="none" opacity="0.3">
    <path d="M 400 450 Q 550 250 800 200"/>
    <path d="M 450 450 Q 600 250 800 220"/>
    <path d="M 500 450 Q 650 250 800 240"/>
  </g>
  
  <!-- Trophy graphic -->
  <g transform="translate(580, 130)">
    <path d="M 30,30 L 110,30 L 100,100 Q 70,140 40,100 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 30,45 Q 0,60 20,85 Q 35,90 35,75" fill="none" stroke="#fbbf24" stroke-width="5"/>
    <path d="M 110,45 Q 140,60 120,85 Q 105,90 105,75" fill="none" stroke="#fbbf24" stroke-width="5"/>
    <rect x="60" y="125" width="20" height="35" fill="#f59e0b"/>
    <rect x="40" y="160" width="60" height="20" rx="3" fill="#d97706"/>
    <circle cx="70" cy="70" r="15" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4" fill="#34d399"/>
    <text x="32" y="21" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ANNUAL SPORTS MEET</text>
    
    <text x="0" y="80" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">SPARDHA 2026</text>
    <text x="0" y="115" fill="#d1fae5" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">Inter-University Sports &amp; Athletics Championship</text>
    
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="130" height="50" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
      <text x="16" y="22" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">DISCIPLINES</text>
      <text x="16" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">12+ Sports</text>
      
      <rect x="145" y="0" width="130" height="50" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1"/>
      <text x="161" y="22" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">CRICKET &amp; FOOTBALL</text>
      <text x="161" y="40" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="700">Green Arena</text>
    </g>
  </g>
  <text x="740" y="420" text-anchor="end" fill="#ffffff" fill-opacity="0.25" font-family="sans-serif" font-size="14" font-weight="700">IEM-UEM ATHLETICS</text>
</svg>